name: Kunlik draftlar + video

on:
  schedule:
    - cron: "30 2 * * *"   # 07:30 Toshkent
  workflow_dispatch:

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Bugungi draftlar (matn/rasm/karusel/so'rovnoma) — har biri alohida so'rovda
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # one draft per request: each item gets the edge function's full time budget
          BASE="$SUPABASE_FUNCTION_URL/sovchi-webhook?generate_next=$WEBHOOK_SECRET"
          SKIP=""
          FIRST="&first=1"
          for i in 1 2 3 4 5 6 7 8; do
            R=$(curl -sS --max-time 170 "$BASE$FIRST&skip=$SKIP" || echo '{"done":false,"error":"curl"}')
            echo "$i: $R"
            FIRST=""
            if [ "$(echo "$R" | jq -r '.done // false' 2>/dev/null || true)" = "true" ]; then break; fi
            F=$(echo "$R" | jq -r '.failed // empty' 2>/dev/null || true)
            if [ -n "$F" ]; then SKIP="${SKIP:+$SKIP,}$F"; fi
          done

  video:
    needs: drafts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: ffmpeg o'rnatish
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Brendli video (video_text bandlari)
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python scripts/make_video.py
