name: Oylik reja

on:
  schedule:
    - cron: "0 3 1 * *"   # har oy 1-kuni 08:00 Toshkent
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Oylik reja yaratish (Gemini, admin'ga yuboriladi)
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS --retry 2 --max-time 60 "$SUPABASE_FUNCTION_URL/sovchi-webhook?generate_plan=$WEBHOOK_SECRET"
