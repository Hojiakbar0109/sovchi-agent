name: Oylik reja

on:
  schedule:
    - cron: "0 3 25 * *"  # har oy 25-kuni 08:00 Toshkent: KEYINGI oy rejasi (1-kungacha tasdiqlashga ulgurasiz)
    - cron: "0 1 1 * *"   # 1-kuni 06:00 Toshkent: zaxira — joriy oy rejasi umuman yo'q bo'lsa
  workflow_dispatch:
    inputs:
      month:
        description: "Oy (YYYY-MM). Bo'sh = joriy oy"
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Oylik reja yaratish (Gemini, admin'ga yuboriladi)
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          EXTRA=""
          if [ -n "$INPUT_MONTH" ]; then
            MONTH="$INPUT_MONTH"
          elif [ "$SCHEDULE" = "0 3 25 * *" ]; then
            MONTH=$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)
          else
            MONTH=$(TZ=Asia/Tashkent date +%Y-%m)
            EXTRA="&if_missing=1"
          fi
          echo "Oy: $MONTH"
          curl -fsS --retry 2 --max-time 60 "$SUPABASE_FUNCTION_URL/sovchi-webhook?generate_plan=$WEBHOOK_SECRET&month=$MONTH$EXTRA"
